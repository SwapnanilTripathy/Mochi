<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mochi</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="pet" id="pet" aria-label="Mochi">
    <div class="ear left"></div>
    <div class="ear right"></div>
    <div class="head">
      <div class="face">
        <span class="eye left-eye"></span>
        <span class="eye right-eye"></span>
        <span class="nose"></span>
        <span class="mouth"></span>
      </div>
      <div class="headphone left-phone"></div>
      <div class="headphone right-phone"></div>
    </div>
    <div class="body"></div>
    <div class="tail"></div>
  </div>
</body>
</html>
