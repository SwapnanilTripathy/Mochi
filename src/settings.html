<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mochi Settings</title><link rel="stylesheet" href="./settings.css"></head><body><main class="panel"><header><div><div class="eyebrow">MOCHI</div><h1>Settings</h1><p>Make your tiny companion feel at home.</p></div><div class="mood" id="mood">♡</div></header><section class="card stats"><div><strong id="affection">0</strong><span>Affection</span></div><div><strong id="pats">0</strong><span>Pats</span></div><div><strong id="naps">0</strong><span>Naps</span></div><div><strong id="walks">0</strong><span>Walks</span></div></section><section class="card"><h2>Personality</h2><label class="select-row"><span>Style</span><select id="personality"><option value="playful">Playful</option><option value="calm">Calm</option><option value="curious">Curious</option></select></label></section><section class="card"><h2>Behavior</h2><label class="toggle"><span><b>Wander around</b><small>Let Mochi explore the desktop.</small></span><input id="wander" type="checkbox"><i></i></label><label class="toggle"><span><b>Notice the cursor</b><small>Mochi approaches and watches nearby movement.</small></span><input id="cursorAware" type="checkbox"><i></i></label><label class="toggle"><span><b>Little sounds</b><small>Soft click and treat chimes.</small></span><input id="sounds" type="checkbox"><i></i></label><label class="toggle"><span><b>Desktop notifications</b><small>Occasional milestones and little moments.</small></span><input id="notifications" type="checkbox"><i></i></label><label class="toggle"><span><b>Start with Windows</b><small>Launch Mochi when you sign in.</small></span><input id="startWithWindows" type="checkbox"><i></i></label></section><section class="card"><h2>Sleep</h2><label class="range-row"><span>Nap duration <output id="napValue">7s</output></span><input id="napDuration" type="range" min="3" max="30" step="1"></label></section><footer><button class="ghost" id="resetStats">Reset stats</button><button class="primary" id="close">Done</button></footer></main><script src="./settings.js"></script></body></html>
